<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        a { text-decoration: none; padding: 4px 8px; border-radius: 4px; margin: 2px; display: inline-block; }
        .btn-create { background-color: #4CAF50; color: white; font-size: 16px; padding: 8px 16px; margin-bottom: 10px; }
        .btn-edit { background-color: #2196F3; color: white; }
        .btn-delete { background-color: #f44336; color: white; }
        .btn-nav { background-color: #607D8B; color: white; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Lista de Clientes</h1>
    <p>Total de clientes: <span th:text="${size}" style="color: #4CAF50; font-weight: bold;">0</span></p>

    <a href="/clientes/create" class="btn-create">+ Novo Cliente</a>

    <div style="margin-bottom: 10px;">
        <a href="/enderecos/index" class="btn-nav">Endereços</a>
        <a href="/telefones/index" class="btn-nav">Telefones</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.id}">1</td>
                <td th:text="${cliente.nome}">Nome</td>
                <td th:text="${cliente.cpf}">000.000.000-00</td>
                <td th:text="${cliente.email}">email@example.com</td>
                <td>
                    <a th:href="@{/clientes/edit/{id}(id=${cliente.id})}" class="btn-edit">Editar</a>
                    <a th:href="@{/clientes/delete/{id}(id=${cliente.id})}" class="btn-delete"
                       onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
