<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 500px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 20px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1976D2; }
        a { color: #2196F3; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Editar Cliente</h1>
    <a href="/clientes/index">&larr; Voltar para lista</a>

    <form th:action="@{/clientes/update/{id}(id=${cliente.id})}" method="post">
        <label>Nome:</label>
        <input type="text" name="nome" th:value="${cliente.nome}" required>

        <label>CPF:</label>
        <input type="text" name="cpf" th:value="${cliente.cpf}" required>

        <label>Email:</label>
        <input type="email" name="email" th:value="${cliente.email}" required>

        <button type="submit">Atualizar</button>
    </form>
</body>
</html>
